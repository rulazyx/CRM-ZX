<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ocaz | Voitures d'occasion des pros à La Réunion</title>
<meta name="description" content="Ocaz, le réseau des garages et marchands VO de La Réunion : trouvez une voiture d'occasion chez un pro de l'île.">
<link rel="canonical" href="https://ocaz.re/">
<meta property="og:title" content="Ocaz | Roulez local, achetez pro">
<meta property="og:description" content="Les voitures d'occasion des garages professionnels de La Réunion.">
<meta property="og:url" content="https://ocaz.re/">
<meta property="og:type" content="website">
<meta property="og:image" content="https://ocaz.re/icon-512.png">
<meta name="theme-color" content="#0d0f12">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<script>
// L'appli des pros a déménagé sur pro.ocaz.re : anciens liens (?espace=…, #pro) et appli installée sur l'écran d'accueil.
(() => {
  const q = new URLSearchParams(location.search);
  const installee = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (q.has('espace') || location.hash === '#pro' || installee) location.replace('https://pro.ocaz.re/' + location.search);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="marque.css">
<style>
:root { --accent: #f59e0b; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 16px; color: #fff;
  font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  background: radial-gradient(circle at 50% 40%, #2a2f37 0%, #0d0f12 70%) fixed #0d0f12; }
.accueil { width: min(440px, 100%); display: grid; gap: 12px; justify-items: center; text-align: center; }
.accueil img { border-radius: 18px; box-shadow: 0 18px 50px rgba(0, 0, 0, .5); }
.accueil h1 { margin: 0; font-size: 28px; font-weight: 600; }
.accueil-slogan { margin: -6px 0 10px; color: #c9cbd0; font-size: 16px; }
.accueil-particulier { width: 100%; display: grid; gap: 4px; justify-items: center; padding: 22px 18px; border-radius: 20px;
  background: var(--accent); color: #111; text-decoration: none; box-shadow: 0 20px 60px rgba(0, 0, 0, .45); transition: transform .15s; }
.accueil-particulier:hover, .accueil-particulier:focus-visible { transform: translateY(-3px); outline: none; }
.accueil-ico { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: rgba(0, 0, 0, .1); margin-bottom: 4px; }
.accueil-particulier b { font-size: 20px; }
.accueil-particulier small { font-size: 15px; color: #3b2a05; }
</style>
</head>
<body>
<main class="accueil">
  <img src="logo.svg" alt="" width="72" height="72">
  <h1><span class="brand-name">OCAZ</span></h1>
  <p class="accueil-slogan">Roulez local, achetez pro</p>
  <a class="accueil-particulier" href="reseau">
    <span class="accueil-ico"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 16H3.8a.8.8 0 0 1-.8-.8v-3.1c0-.7.4-1.3 1-1.6l1.3-.6L7 6.9A2 2 0 0 1 8.8 6h6.4a2 2 0 0 1 1.8 1l1.7 2.9 1.3.6c.6.3 1 .9 1 1.6v3.1a.8.8 0 0 1-.8.8H19"/><path d="M9 16h6"/><circle cx="7" cy="16" r="2"/><circle cx="17" cy="16" r="2"/><path d="M5.5 10h13"/></svg></span>
    <b>Particulier</b><small>Je cherche une voiture</small></a>
</main>
</body>
</html>
