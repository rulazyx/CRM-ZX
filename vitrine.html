<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Véhicules d'occasion</title>
<meta name="description" content="Véhicules d'occasion disponibles, photos, prix et contact direct.">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f6fb; --card: #fff; --text: #0f172a; --muted: #64748b; --line: #e4e8f0;
  --primary: #2563eb; --accent: #f59e0b; --green: #16a34a; --wa: #1faa53; --navy: #0f172a;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0a1020; --card: #111a2e; --text: #e2e8f0; --muted: #94a3b8; --line: #1f2a40; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 Inter, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
header { background: linear-gradient(120deg, var(--navy), #13224a); color: #fff; padding: calc(18px + env(safe-area-inset-top)) 16px 22px; }
.tete { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.tete img { width: 56px; height: 56px; border-radius: 12px; object-fit: contain; background: #fff; }
.tete h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
.tete p { margin: 2px 0 0; color: #cbd5e1; font-size: 14px; }
.contact { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); font-weight: 600; text-decoration: none; cursor: pointer; }
.btn.wa { background: var(--wa); border-color: var(--wa); color: #fff; }
.btn.tel { background: #fff; color: var(--navy); border-color: #fff; }
.btn.primaire { background: var(--primary); border-color: var(--primary); color: #fff; }
main { max-width: 1120px; margin: 0 auto; padding: 16px; }
.filtres { display: grid; grid-template-columns: minmax(0, 2fr) repeat(4, minmax(0, 1fr)); gap: 8px; margin: -34px 0 14px; background: var(--card); padding: 10px;
  border-radius: 16px; box-shadow: 0 6px 24px rgba(15, 23, 42, .1); }
.filtres input, .filtres select { width: 100%; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
@media (max-width: 760px) { .filtres { grid-template-columns: 1fr 1fr; } .filtres input { grid-column: 1 / -1; } }
.compte { color: var(--muted); font-size: 14px; margin: 4px 2px 12px; }
.grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.carte { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; cursor: pointer; text-align: left; padding: 0;
  transition: transform .15s, box-shadow .15s; display: flex; flex-direction: column; }
.carte:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(15, 23, 42, .12); }
.photo { aspect-ratio: 4 / 3; background: color-mix(in srgb, var(--line) 60%, var(--card)); position: relative; display: grid; place-items: center; color: var(--muted); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .nb { position: absolute; right: 8px; bottom: 8px; background: rgba(15, 23, 42, .7); color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 99px; }
.reserve { position: absolute; left: 8px; top: 8px; background: var(--accent); color: #111; font-weight: 700; font-size: 12px; padding: 3px 9px; border-radius: 99px; }
.carte .corps { padding: 12px 14px 14px; display: grid; gap: 4px; }
.carte h2 { font-size: 16px; margin: 0; line-height: 1.3; }
.carte .infos { color: var(--muted); font-size: 13.5px; }
.carte .prix { font-size: 20px; font-weight: 800; color: var(--primary); margin-top: 4px; }
.vide { text-align: center; color: var(--muted); padding: 48px 16px; }
dialog { border: 0; padding: 0; border-radius: 18px; width: min(860px, 100vw); max-height: 100dvh; background: var(--card); color: var(--text); }
dialog::backdrop { background: rgba(15, 23, 42, .6); }
@media (max-width: 760px) { dialog { width: 100vw; height: 100dvh; max-width: 100vw; max-height: 100dvh; border-radius: 0; margin: 0; } }
.fiche { display: flex; flex-direction: column; max-height: 100dvh; }
.fiche-haut { position: relative; }
.carrousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; aspect-ratio: 16 / 10; background: #000; }
.carrousel img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: contain; scroll-snap-align: center; }
.carrousel .sans { flex: 0 0 100%; display: grid; place-items: center; color: #94a3b8; }
.fermer { position: absolute; top: 10px; right: 10px; width: 38px; height: 38px; border-radius: 99px; border: 0; background: rgba(15, 23, 42, .65); color: #fff; font-size: 18px; cursor: pointer; }
.compteur { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, .65); color: #fff; font-size: 12.5px; padding: 3px 10px; border-radius: 99px; }
.fiche-corps { padding: 16px 18px 22px; overflow-y: auto; display: grid; gap: 12px; }
.fiche-corps h2 { margin: 0; font-size: 21px; }
.fiche-corps .prix { font-size: 26px; font-weight: 800; color: var(--primary); }
.specs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.specs div { background: color-mix(in srgb, var(--line) 45%, var(--card)); border-radius: 10px; padding: 8px 10px; }
.specs b { display: block; font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.texte { white-space: pre-line; color: var(--text); font-size: 14.5px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
form { display: grid; gap: 8px; border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
form h3 { margin: 0; font-size: 15px; }
form input, form textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
form .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 480px) { form .deux { grid-template-columns: 1fr; } }
.merci { color: var(--green); font-weight: 600; }
.erreur { color: #dc2626; font-weight: 600; }
footer { text-align: center; color: var(--muted); font-size: 12.5px; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
footer a { color: var(--muted); }
.ico { width: 18px; height: 18px; }
/* Intégrée au site du garage (integrer.js ou lien &integre=1) : sans en-tête, fond transparent. */
.integre body { background: transparent; }
.integre header { display: none; }
.integre main { padding: 8px 4px; }
.integre .filtres { margin-top: 0; box-shadow: none; border: 1px solid var(--line); }
.integre footer { padding: 14px 8px; font-size: 11.5px; }
/* Hauteur ajustée par le site : la fiche s'ouvre en haut de la zone visible, à la taille de l'écran du visiteur. */
.auto dialog { margin: var(--y, 0px) auto auto; max-height: var(--ecran, 100dvh); }
.auto .fiche { max-height: var(--ecran, 100dvh); }
@media (max-width: 760px) { .auto dialog { height: var(--ecran, 100dvh); } }
</style>
</head>
<body>
<header><div class="tete" id="tete"><div><h1>Chargement…</h1></div></div></header>
<main>
  <div class="filtres" id="filtres" hidden>
    <input id="f-q" type="search" placeholder="Rechercher une marque, un modèle…" aria-label="Rechercher">
    <select id="f-marque" aria-label="Marque"></select>
    <select id="f-prix" aria-label="Prix maximum"></select>
    <select id="f-carburant" aria-label="Carburant"></select>
    <select id="f-tri" aria-label="Trier">
      <option value="recent">Plus récents</option><option value="prix">Prix croissant</option><option value="prix-">Prix décroissant</option><option value="km">Kilométrage</option>
    </select>
  </div>
  <p class="compte" id="compte"></p>
  <div class="grille" id="grille"></div>
</main>
<footer id="pied">Vitrine mise à jour en direct par <a href="./" rel="noopener">Ocaz</a>, le logiciel des marchands automobiles de La Réunion.</footer>

<dialog id="dlg"><div class="fiche" id="fiche"></div></dialog>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="vitrine.js"></script>
</body>
</html>
